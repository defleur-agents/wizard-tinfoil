services:
  wizard-tinfoil:
    image: 127.0.0.1:5000/wizard-tinfoil:0.1.0-owner.4@sha256:ed1aa42ebc087c03e5f9f6ee0c24572331725521435a729185fe527193c6c4b0
    user: 1000:1000
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    tmpfs:
    - /tmp
    environment:
      PORT: '18804'
      DATA_DIR: /data/private
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
      HOME: /data/private
      XDG_CACHE_HOME: /data/private/cache
      XDG_DATA_HOME: /data/private/share
    volumes:
    - tinfoil-private-data:/data
    read_only: true
    command:
    - python
    - -c
    - "import base64,json,pathlib,runpy\nroot=pathlib.Path('/tmp/wizard-app');root.mkdir(exist_ok=True)\n\
      files=json.loads(base64.b64decode(''))\n\
      for name,text in files.items():\n p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)\n\
      runpy.run_path(str(root/'app/server.py'),run_name='__main__')\n"
    x-runtipi:
      is_main: true
      internal_port: 18804
x-runtipi:
  schema_version: 2
  overrides: []
volumes:
  tinfoil-private-data:
    name: wizard-tinfoil-private-data
